[project]
name = "saucedemo-framework-ez"
version = "0.1.0"
description = "Playwright + pytest Page Object Model framework for Sauce Demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "allure-pytest>=2.16.1",
    "faker>=40.39.0",
    "pytest>=9.1.1",
    "pytest-bdd>=9.0.0",
    "pytest-playwright>=0.9.0",
    "python-dotenv>=1.2.3",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-v",
    "--browser=chromium",
    "--base-url=https://www.saucedemo.com",
    "--screenshot=only-on-failure",
    "--output=artifacts",
    "--alluredir=allure-results",
    "--clean-alluredir",
]
log_file = "logs/test_run.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s %(levelname)-5s %(name)s: %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
